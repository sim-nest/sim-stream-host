schema = "sim.device-provider-pack-catalog/v1"
revision = 4
default_authority = "observe"
effect_admission = "registered-descriptor-only"

# Public packs describe reusable apparatus families. Physical identity, ownership,
# LAN coordinates, credentials, firmware observations, and host selection belong
# in the private selection record.

[[pack]]
id = "computer-placement"
transport = "native"
observations = ["placement/capacity", "placement/health"]
effects = []
unsupported = ["process/spawn", "host/admin"]
fallback = "manual-placement"
cassette = "cassettes.toml#computer-placement"

[[pack]]
id = "android-relay"
transport = "ble"
observations = ["relay/availability", "relay/link-quality"]
effects = []
unsupported = ["device/enroll", "credential/install", "os/configure"]
fallback = "manual-relay"
cassette = "cassettes.toml#android-relay"

[[pack]]
id = "halo"
transport = "ble"
